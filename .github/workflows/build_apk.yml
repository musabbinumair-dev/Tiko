name: Build Tiko APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment & Keystore
        run: |
          # Accept Android licenses
          yes | sdkmanager --licenses || true
          
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env
          
          # Ensure gradlew exists and is executable
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Decode Keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Print Keystore SHA-1
        run: keytool -list -v -keystore debug.keystore -storepass android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiko-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" tiko.apk
          fi

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tiko v${{ github.run_number }}
          files: tiko.apk
          make_latest: "true"
