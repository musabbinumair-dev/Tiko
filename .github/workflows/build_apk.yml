name: Build Tiko APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment & Keystore
        run: |
          # Accept Android licenses
          yes | sdkmanager --licenses || true
          
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env
          
          # Ensure gradlew exists and is executable
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Create Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: Missing secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Create Google Services JSON from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Error: Missing secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Print Keystore SHA-1
        run: keytool -list -v -keystore debug.keystore -storepass android

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiko-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" tiko.apk
          fi

      - name: Generate version.json and Release Notes
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          COMMIT_NOTES: ${{ github.event.head_commit.message }}
        run: |
          # Sanitize commit messages: remove metadata and merge logs
          CLEAN_NOTES=$(echo "$COMMIT_NOTES" | sed -E '/^(Co-authored-by|Signed-off-by|Merge branch|Merge pull request):/Id' | sed '/^[[:space:]]*$/d' | head -n 8)
          if [ -z "$CLEAN_NOTES" ]; then
            CLEAN_NOTES="Performance improvements, bug fixes, and UI polish"
          fi

          # Output version.json for in-app update checker
          jq -n \
            --argjson versionCode "${VERSION_CODE:-1}" \
            --arg versionName "${VERSION_NAME:-1.0.0}" \
            --arg notes "$CLEAN_NOTES" \
            '{"versionCode": $versionCode, "versionName": $versionName, "notes": $notes}' > version.json

          # Output markdown release notes for GitHub Release
          printf "### What's New in Tiko 1.0.%s\n\n%s\n" "${VERSION_CODE:-1}" "$CLEAN_NOTES" > release_notes.md

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tiko 1.0.${{ github.run_number }}
          body_path: release_notes.md
          files: |
            tiko.apk
            version.json
          make_latest: "true"

