name: Build Tiko APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          # Accept Android licenses
          yes | sdkmanager --licenses || true
          
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env
          
          # Ensure gradlew exists and is executable
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Create signing key (first time only)
        env:
          KEYSTORE_PASSWORD: "tiko_secure_password_2026_xyz"
        run: |
          if [ ! -f "app/tiko.keystore" ]; then
            keytool -genkeypair \
              -keystore app/tiko.keystore \
              -alias tiko \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Tiko" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD"
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add -f app/tiko.keystore
            git commit -m "Add signing key [skip ci]" || true
            git push || true
          fi

      - name: Print Keystore SHA-1 and SHA-256
        run: |
          keytool -list -v -keystore app/tiko.keystore -storepass "tiko_secure_password_2026_xyz" | grep -iE "sha1|sha-1|sha256|sha-256" >> $GITHUB_STEP_SUMMARY || true

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: app/tiko.keystore
          KEYSTORE_PASSWORD: "tiko_secure_password_2026_xyz"
          KEY_ALIAS: tiko
          KEY_PASSWORD: "tiko_secure_password_2026_xyz"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiko-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" tiko.apk
          fi

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tiko v${{ github.run_number }}
          files: tiko.apk
          make_latest: "true"
